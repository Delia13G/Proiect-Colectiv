quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=dev_user
quarkus.datasource.password=dev_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/proiect_colectiv

# Permite aplicației să creeze/actualizeze automat tabelele în baza de date
#quarkus.hibernate-orm.database.generation=update
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.hibernate-orm.database.generation=drop-and-create
smallrye.jwt.sign.key.location=privateKey.pkcs8.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://cliq.com/issuer

%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/proiect_colectiv
%test.quarkus.datasource.username=dev_user
%test.quarkus.datasource.password=dev_password

quarkus.http.auth.permission.public.paths=/api/auth/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.proactive=false
