quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=dev_user
quarkus.datasource.password=dev_password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/proiect_colectiv

# Permite aplicației să creeze/actualizeze automat tabelele în baza de date
quarkus.hibernate-orm.database.generation=update
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173, http://127.0.0.1:5173
quarkus.http.cors.methods=GET, POST, OPTIONS
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with